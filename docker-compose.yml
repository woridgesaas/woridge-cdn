services:
  woridge.cdn:
    container_name: woridge-cdn
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped

    ports:
      - "8800:80"
    volumes:
      - cache-data:/var/cache/nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    env_file:
      - .env
    networks:
      - shared-infra-net

    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:80"]
        interval: 30s
        timeout: 5s
        retries: 3
  

volumes:
  cache-data:
    name: woridge_cdn_cache  

networks:
  shared-infra-net:
    external: true  
    name: shared-infra-net 
