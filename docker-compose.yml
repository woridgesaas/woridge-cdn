services:
  woridge.cdn:
    container_name: woridge-cdn
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped

    ports:
      - "8800:80"
    volumes:
      - cache-data:/var/cache/nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    env_file:
      - .env
    networks:
      - shared-infra-net

    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:80"]
        interval: 30s
        timeout: 5s
        retries: 3
    depends_on:
      - sigv4-proxy
  
  #to sign requests
  sigv4-proxy:
    image: public.ecr.aws/aws-observability/aws-sigv4-proxy:latest
    container_name: aws-sigv4-proxy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_REGION: us-east-1
    command: --port 8080 --endpoint http://minio:9000 --signing-enabled
    networks:
      - shared-infra-net
    restart: unless-stopped

volumes:
  cache-data:
    name: woridge_cdn_cache  

networks:
  shared-infra-net:
    external: true  
    name: shared-infra-net 
